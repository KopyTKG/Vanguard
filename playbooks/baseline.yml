---
# The shared baseline every client gets. Run: `just baseline`
- name: Baseline
  hosts: all:!proxmox
  become: true

  tasks:
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Clean old packages
      ansible.builtin.apt:
        autoclean: true
        autoremove: true

    - name: Update and upgrade apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
        autoclean: true
        autoremove: true

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present

    - name: Enable unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Ensure fish is a valid login shell
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: /usr/bin/fish

    - name: Set fish as root's default shell
      ansible.builtin.user:
        name: root
        shell: /usr/bin/fish

    # mise via the official apt repo (extrepo enables it declaratively).
    - name: Install extrepo
      ansible.builtin.apt:
        name: extrepo
        state: present

    - name: Enable the mise apt repo
      ansible.builtin.command: extrepo enable mise
      args:
        creates: /etc/apt/sources.list.d/extrepo_mise.sources

    - name: Install mise
      ansible.builtin.apt:
        name: mise
        state: present
        update_cache: true

    - name: Ensure fish config dir for root
      ansible.builtin.file:
        path: /root/.config/fish
        state: directory
        mode: "0755"

    - name: Activate mise in fish
      ansible.builtin.lineinfile:
        path: /root/.config/fish/config.fish
        line: "mise activate fish | source"
        create: true
        mode: "0644"

    - name: Run fastfetch in interactive fish
      ansible.builtin.lineinfile:
        path: /root/.config/fish/config.fish
        line: "status is-interactive; and fastfetch"
        create: true
        mode: "0644"

    - name: Strip the stock Debian login banner for root
      ansible.builtin.include_tasks: tasks/quiet-login.yml
      vars:
        quiet_login_homes: ["/root"]

    - name: Ensure fish functions dir for root
      ansible.builtin.file:
        path: /root/.config/fish/functions
        state: directory
        mode: "0755"

    # force: false so an app playbook's how-to greeting is never overwritten.
    - name: Silence the fish greeting unless an app playbook set one
      ansible.builtin.copy:
        dest: /root/.config/fish/functions/fish_greeting.fish
        content: "function fish_greeting; end"
        force: false
        mode: "0644"

    - name: Install the baseline vim config
      ansible.builtin.copy:
        src: files/vimrc
        dest: /root/.vimrc
        mode: "0644"

    - name: Ensure fastfetch config dir for root
      ansible.builtin.file:
        path: /root/.config/fastfetch
        state: directory
        mode: "0755"

    - name: Install the baseline fastfetch config
      ansible.builtin.copy:
        src: files/fastfetch.jsonc
        dest: /root/.config/fastfetch/config.jsonc
        mode: "0644"
