---
# Install a Minecraft server (vanilla, or a Modrinth/CurseForge modpack) on the
# minecraft clients, running as an unprivileged `minecraft` user with Java from
# mise. Run: `just install minecraft`
#
# Per-host settings live in host_vars/<client>.yml, defaults and a full
# example in group_vars/minecraft.yml.
- name: Install Minecraft modpack server
  hosts: minecraft
  become: true

  tasks:
    - name: Check the host is configured
      ansible.builtin.assert:
        that:
          - mc_eula | bool
          - mc_modpack.source | default('') in ['vanilla', 'modrinth', 'curseforge']
          - mc_modpack.source != 'vanilla' or mc_modpack.version is defined
          - mc_modpack.source != 'modrinth' or mc_modpack.pack is defined
          - mc_modpack.source != 'curseforge' or mc_modpack.url is defined
        fail_msg: >-
          Set mc_eula: true (you accept https://aka.ms/MinecraftEULA) and an
          mc_modpack (source: vanilla + version, source: modrinth + pack, or
          source: curseforge + url) in
          host_vars/{{ inventory_hostname }}.yml. See group_vars/minecraft.yml.
        quiet: true

    - name: Install Minecraft dependencies
      ansible.builtin.apt:
        name: "{{ mc_packages }}"
        state: present

    # No sudo group and no password: root reaches this user with `su - minecraft`.
    - name: Create the minecraft user
      ansible.builtin.user:
        name: "{{ mc_user }}"
        home: "{{ mc_home }}"
        create_home: true
        shell: /usr/bin/fish
        password: "!"
        update_password: on_create

    # /var/log needs root to create a new entry under it — the minecraft user
    # can write log files here afterwards, but not make the directory.
    - name: Create the log directory for the launcher
      ansible.builtin.file:
        path: /var/log/minecraft
        state: directory
        owner: "{{ mc_user }}"
        mode: "0755"

    - name: Install mrpack-install (Modrinth server pack installer)
      ansible.builtin.get_url:
        url: https://github.com/nothub/mrpack-install/releases/latest/download/mrpack-install-linux
        dest: /usr/local/bin/mrpack-install
        mode: "0755"
      when: mc_modpack.source | default('') == 'modrinth'

    - name: Set up Java and the modpack as the minecraft user
      become_user: "{{ mc_user }}"
      block:
        - name: Ensure fish functions dir for minecraft
          ansible.builtin.file:
            path: "{{ mc_home }}/.config/fish/functions"
            state: directory
            mode: "0755"

        - name: Activate mise in fish
          ansible.builtin.lineinfile:
            path: "{{ mc_home }}/.config/fish/config.fish"
            line: "mise activate fish | source"
            create: true
            mode: "0644"

        - name: Ensure fish conf.d dir for minecraft
          ansible.builtin.file:
            path: "{{ mc_home }}/.config/fish/conf.d"
            state: directory
            mode: "0755"

        - name: Put the home dir on PATH, so scripts run without ./
          ansible.builtin.copy:
            dest: "{{ mc_home }}/.config/fish/conf.d/launcher-path.fish"
            mode: "0644"
            content: |
              # Managed by Ansible. Appended to the very end of PATH so it can't shadow
              # system commands (fish_add_path would put it ahead of /usr/bin).
              contains -- $HOME $PATH; or set --global --export --append PATH $HOME

        - name: Tab-complete the launcher
          ansible.builtin.template:
            src: launcher-completions.fish.j2
            dest: "{{ mc_home }}/.config/fish/conf.d/launcher-completions.fish"
            mode: "0644"
          vars:
            comp_cmds: [minecraft.sh]
            comp_cmd_hints: [say, save-all, save-off, save-on, list, whitelist, op, deop, kick, ban, pardon, tp, gamemode, difficulty, weather, time]

        - name: Show how to use the launcher on login
          ansible.builtin.template:
            src: minecraft-greeting.fish.j2
            dest: "{{ mc_home }}/.config/fish/functions/fish_greeting.fish"
            mode: "0644"

        - name: Install Java and set it as the global version
          ansible.builtin.command: "mise use --global java@{{ mc_java }}"
          environment:
            MISE_YES: "1"
          register: mise_java
          changed_when: "'install' in mise_java.stderr"

        - name: Create the server directory
          ansible.builtin.file:
            path: "{{ mc_home }}/server"
            state: directory
            mode: "0755"

        - name: Read which pack is installed
          ansible.builtin.slurp:
            src: "{{ mc_home }}/server/.modpack"
          register: mc_installed
          failed_when: false

        - name: Work out which pack is wanted
          ansible.builtin.set_fact:
            mc_pack_id: >-
              {{ mc_modpack.source }}:{{ mc_modpack.pack | default(mc_modpack.url | default('')) }}:{{ mc_modpack.version | default('latest') }}{{ ('+' ~ mc_force_mods | join('+')) if mc_force_mods else '' }}
            mc_pack_have: "{{ (mc_installed.content | default('') | b64decode) | trim }}"

        # Vanilla: Mojang publishes every server jar through a version manifest.
        # `latest` resolves to the current release; the jar's sha1 is checked.
        - name: Install the vanilla server
          when: mc_modpack.source == 'vanilla' and mc_pack_id != mc_pack_have
          block:
            - name: Fetch Mojang's version manifest
              ansible.builtin.uri:
                url: https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
                return_content: true
              register: mc_manifest

            - name: Pick the wanted version
              ansible.builtin.set_fact:
                mc_vanilla_version: >-
                  {{ mc_manifest.json.latest.release if mc_modpack.version == 'latest' else mc_modpack.version }}

            - name: Check Mojang knows that version
              ansible.builtin.assert:
                that: mc_manifest.json.versions | selectattr('id', 'equalto', mc_vanilla_version) | list | length == 1
                fail_msg: "Minecraft {{ mc_vanilla_version }} is not in Mojang's version manifest."
                quiet: true

            - name: Fetch that version's metadata
              ansible.builtin.uri:
                url: "{{ (mc_manifest.json.versions | selectattr('id', 'equalto', mc_vanilla_version) | first).url }}"
                return_content: true
              register: mc_vmeta

            - name: Download server.jar
              ansible.builtin.get_url:
                url: "{{ mc_vmeta.json.downloads.server.url }}"
                dest: "{{ mc_home }}/server/server.jar"
                checksum: "sha1:{{ mc_vmeta.json.downloads.server.sha1 }}"
                mode: "0644"
                force: true
              register: mc_vanilla_jar
              changed_when: true

        # A pack that changes (new pack, or a new version of it) can span Minecraft
        # versions, and mrpack-install only adds files — it never removes the old
        # pack's mods or loader. So clear those first. Worlds, configs and
        # server.properties are left alone.
        - name: Clear the previous pack's mods and loader
          when: mc_pack_have != '' and mc_pack_id != mc_pack_have
          ansible.builtin.file:
            path: "{{ mc_home }}/server/{{ item }}"
            state: absent
          loop: [mods, libraries, run.sh, run.bat, user_jvm_args.txt, server.jar, fabric-server-launch.jar, quilt-server-launch.jar, .fabric]

        - name: Remove old Forge and Fabric jars
          when: mc_pack_have != '' and mc_pack_id != mc_pack_have
          ansible.builtin.shell: rm -f forge-*.jar fabric-server-*.jar
          args:
            chdir: "{{ mc_home }}/server"
          changed_when: false

        # Everything Modrinth: resolve the pack version (API), read the loader out
        # of the .mrpack and install the right server. mrpack-install builds
        # Fabric/Quilt/vanilla servers itself, but not Forge (it errors) or NeoForge
        # (it silently installs a *vanilla* jar), so for those the loader's own
        # installer runs first and mrpack-install is pointed at its output with
        # --server-file so it only adds mods and config.
        - name: Install the Modrinth pack
          when: mc_modpack.source == 'modrinth' and mc_pack_id != mc_pack_have
          register: mc_mrpack
          changed_when: true
          environment:
            SPEC: "{{ mc_modpack.pack }}"
            VER: "{{ mc_modpack.version | default('') }}"
            FORCE: "{{ mc_force_mods | join('\n') }}"
          ansible.builtin.shell:
            cmd: |
              set -eu
              cd "{{ mc_home }}/server"
              spec="$SPEC"; ver="${VER:-}"
              JAVA="$(mise which java)"
              MRPACK=mrpack-install
              case "$spec" in
                  http://*|https://*) url="$spec" ;;
                  */*|*.mrpack)       cp "$spec" pack.mrpack; url="" ;;
                  *)
                      # Modrinth slug or project id: resolve the version through the API.
                      url=$(python3 - "$spec" "$ver" <<'PY'
              import json, sys, urllib.request
              spec, ver = sys.argv[1], sys.argv[2]
              req = urllib.request.Request(
                  "https://api.modrinth.com/v2/project/%s/version" % spec,
                  headers={"User-Agent": "vanguard-ansible/1.0"})
              versions = json.load(urllib.request.urlopen(req))
              if ver:
                  pick = [v for v in versions if ver in (v["version_number"], v["id"])]
              else:
                  # mrpack-install's "latest" skips pre-releases; do the same.
                  pick = [v for v in versions if v["version_type"] == "release"] or versions
              if not pick:
                  sys.exit("No version %r of Modrinth pack %r" % (ver, spec))
              files = pick[0]["files"]
              print(next((f for f in files if f.get("primary")), files[0])["url"])
              PY
                      ) ;;
              esac
              [ -z "$url" ] || curl -fsSL -o pack.mrpack "$url"
              deps=$(unzip -p pack.mrpack modrinth.index.json)
              dep() { printf '%s' "$deps" | python3 -c "import json,sys; print(json.load(sys.stdin)['dependencies'].get('$1', ''))"; }
              mc=$(dep minecraft); nf=$(dep neoforge); fg=$(dep forge)
              if [ -n "$nf" ]; then
                  inst="https://maven.neoforged.net/releases/net/neoforged/neoforge/$nf/neoforge-$nf-installer.jar"
              elif [ -n "$fg" ]; then
                  inst="https://maven.minecraftforge.net/net/minecraftforge/forge/$mc-$fg/forge-$mc-$fg-installer.jar"
              else
                  inst=""
              fi
              if [ -n "$inst" ]; then
                  # mrpack-install can't build these servers (Forge errors out, NeoForge
                  # silently falls back to a vanilla jar), so run the loader's own installer
                  # first and point mrpack-install at the result.
                  echo "Installing the server loader from $inst"
                  curl -fsSL -o installer.jar "$inst"
                  "$JAVA" -jar installer.jar --installServer
                  rm -f installer.jar installer.jar.log
                  # 1.17+ writes run.sh; older Forge writes forge-<mc>-<ver>.jar.
                  if [ -f run.sh ]; then sf=run.sh; else sf=$(ls forge-*.jar | head -1); fi
                  "$MRPACK" ./pack.mrpack --server-dir . --server-file "$sf"
              else
                  # Fabric/Quilt/vanilla: pin the file name, mrpack-install otherwise
                  # picks fabric-server-mc.<mc>-loader.<x>-launcher.<y>.jar.
                  "$MRPACK" ./pack.mrpack --server-dir . --server-file server.jar
              fi
              # Mods the pack marks client-only (mrpack-install skips them) that the
              # server needs anyway, e.g. a library another mod depends on.
              if [ -n "${FORCE:-}" ]; then
                  python3 - ./pack.mrpack <<'PY'
              import fnmatch, hashlib, json, os, sys, urllib.request, zipfile
              index = json.loads(zipfile.ZipFile(sys.argv[1]).read("modrinth.index.json"))
              globs = os.environ["FORCE"].split()
              for f in index["files"]:
                  name = os.path.basename(f["path"])
                  if not any(fnmatch.fnmatch(name, g) for g in globs):
                      continue
                  data = urllib.request.urlopen(urllib.request.Request(
                      f["downloads"][0], headers={"User-Agent": "vanguard-ansible/1.0"})).read()
                  if hashlib.sha512(data).hexdigest() != f["hashes"]["sha512"]:
                      sys.exit("sha512 mismatch for " + name)
                  os.makedirs(os.path.dirname(f["path"]), exist_ok=True)
                  open(f["path"], "wb").write(data)
                  print("Forced:", f["path"])
              PY
              fi
              rm -f pack.mrpack

          args:
            executable: /bin/bash

        - name: Install the CurseForge server pack
          when: mc_modpack.source == 'curseforge' and mc_pack_id != mc_pack_have
          register: mc_curse
          changed_when: true
          ansible.builtin.shell: |
            set -e
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL -o "$tmp/pack.zip" '{{ mc_modpack.url }}'
            unzip -q "$tmp/pack.zip" -d "$tmp/x"
            # Server packs usually wrap everything in one top-level folder.
            src="$tmp/x"
            [ "$(ls -A "$src" | wc -l)" = 1 ] && [ -d "$src/$(ls -A "$src")" ] && src="$src/$(ls -A "$src")"
            cp -a "$src"/. "{{ mc_home }}/server/"
          args:
            executable: /bin/bash

        - name: Remember which pack is installed
          ansible.builtin.copy:
            content: "{{ mc_pack_id }}\n"
            dest: "{{ mc_home }}/server/.modpack"
            mode: "0644"
          when: mc_pack_id != mc_pack_have

        # Packs often ship client-only mods that crash a dedicated server. They're
        # listed per host in mc_remove_mods and removed on every run, so a
        # reinstall of the pack doesn't bring them back.
        - name: Find client-only mods to remove
          ansible.builtin.find:
            paths: "{{ mc_home }}/server/mods"
            patterns: "{{ mc_remove_mods }}"
          register: mc_unwanted
          when: mc_remove_mods | length > 0

        - name: Remove them
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ mc_unwanted.files | default([]) }}"
          loop_control:
            label: "{{ item.path | basename }}"

        - name: Accept the Mojang EULA
          ansible.builtin.copy:
            content: "eula=true\n"
            dest: "{{ mc_home }}/server/eula.txt"
            mode: "0644"

        - name: Set server.properties
          ansible.builtin.lineinfile:
            path: "{{ mc_home }}/server/server.properties"
            regexp: "^{{ item.key | regex_escape }}="
            line: "{{ item.key }}={{ (item.value | string | lower) if item.value is boolean else item.value }}"
            create: true
            mode: "0644"
          loop: "{{ mc_server_properties | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          vars:
            mc_server_properties: >-
              {{ {'server-port': mc_port}
                 | combine({'max-players': mc_max_players} if mc_max_players is not none else {})
                 | combine({'motd': mc_motd} if mc_motd is not none else {})
                 | combine({'level-seed': mc_seed} if mc_seed is not none else {})
                 | combine(mc_properties) }}

        - name: Look up whitelist UUIDs
          ansible.builtin.uri:
            url: "https://api.mojang.com/users/profiles/minecraft/{{ item }}"
            return_content: true
            status_code: [200, 204, 404]
          register: mc_wl_lookup
          loop: "{{ mc_whitelist | default([], true) }}"
          when: mc_whitelist is not none

        - name: Fail on unknown player names
          ansible.builtin.assert:
            that: item.status == 200
            fail_msg: "No Mojang account named {{ item.item }}"
          loop: "{{ mc_wl_lookup.results | default([]) }}"
          loop_control:
            label: "{{ item.item }}"
          when: mc_whitelist is not none

        - name: Write whitelist.json
          ansible.builtin.copy:
            content: |
              {% set ns = namespace(out=[]) %}
              {% for r in mc_wl_lookup.results %}
              {% set i = r.json.id %}
              {% set ns.out = ns.out + [{'uuid': i[0:8] ~ '-' ~ i[8:12] ~ '-' ~ i[12:16] ~ '-' ~ i[16:20] ~ '-' ~ i[20:], 'name': r.json.name}] %}
              {% endfor %}
              {{ ns.out | to_nice_json }}
            dest: "{{ mc_home }}/server/whitelist.json"
            mode: "0644"
          when: mc_whitelist is not none

        - name: Look up operator UUIDs
          ansible.builtin.uri:
            url: "https://api.mojang.com/users/profiles/minecraft/{{ item }}"
            return_content: true
            status_code: [200, 204, 404]
          register: mc_ops_lookup
          loop: "{{ mc_ops | default([], true) }}"
          when: mc_ops is not none

        - name: Fail on unknown operator names
          ansible.builtin.assert:
            that: item.status == 200
            fail_msg: "No Mojang account named {{ item.item }}"
          loop: "{{ mc_ops_lookup.results | default([]) }}"
          loop_control:
            label: "{{ item.item }}"
          when: mc_ops is not none

        - name: Write ops.json
          ansible.builtin.copy:
            content: |
              {% set ns = namespace(out=[]) %}
              {% for r in mc_ops_lookup.results %}
              {% set i = r.json.id %}
              {% set ns.out = ns.out + [{'uuid': i[0:8] ~ '-' ~ i[8:12] ~ '-' ~ i[12:16] ~ '-' ~ i[16:20] ~ '-' ~ i[20:], 'name': r.json.name, 'level': mc_op_level | int, 'bypassesPlayerLimit': false}] %}
              {% endfor %}
              {{ ns.out | to_nice_json }}
            dest: "{{ mc_home }}/server/ops.json"
            mode: "0644"
          when: mc_ops is not none

        - name: Enable the whitelist
          ansible.builtin.lineinfile:
            path: "{{ mc_home }}/server/server.properties"
            regexp: "^{{ item }}="
            line: "{{ item }}=true"
          loop: [white-list, enforce-whitelist]
          when: mc_whitelist is not none

    - name: Template the launcher script
      ansible.builtin.template:
        src: minecraft.sh.j2
        dest: "{{ mc_home }}/minecraft.sh"
        owner: "{{ mc_user }}"
        group: "{{ mc_user }}"
        mode: "0755"

    - name: Quiet the stock login banner
      ansible.builtin.include_tasks: tasks/quiet-login.yml
      vars:
        quiet_login_homes: "{{ ['/root', mc_home] }}"

    - name: Ensure cron is running
      ansible.builtin.service:
        name: cron
        state: started
        enabled: true

    # Root writes it: only root can edit someone else's crontab.
    - name: Start the server at boot
      ansible.builtin.cron:
        name: start minecraft
        user: "{{ mc_user }}"
        special_time: reboot
        job: "{{ mc_home }}/minecraft.sh start"

    # Root shortcut: `minecraft` drops into the minecraft user's shell,
    # `minecraft attach` / `minecraft logs` etc. run the launcher directly.
    - name: Install the minecraft switch script
      ansible.builtin.copy:
        dest: /usr/local/bin/minecraft
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env sh
          # Managed by Ansible.
          [ $# -eq 0 ] && exec su - {{ mc_user }}
          exec su - {{ mc_user }} -c "{{ mc_home }}/minecraft.sh $*"

    - name: Ensure fish functions dir for root
      ansible.builtin.file:
        path: /root/.config/fish/functions
        state: directory
        mode: "0755"

    - name: Ensure fish conf.d dir for root
      ansible.builtin.file:
        path: /root/.config/fish/conf.d
        state: directory
        mode: "0755"

    - name: Tab-complete the minecraft switch script
      ansible.builtin.template:
        src: launcher-completions.fish.j2
        dest: /root/.config/fish/conf.d/launcher-completions.fish
        mode: "0644"
      vars:
        comp_cmds: [minecraft]
        comp_cmd_hints: [say, save-all, save-off, save-on, list, whitelist, op, deop, kick, ban, pardon, tp, gamemode, difficulty, weather, time]

    - name: Show how to reach the minecraft user on root login
      ansible.builtin.template:
        src: minecraft-root-greeting.fish.j2
        dest: /root/.config/fish/functions/fish_greeting.fish
        mode: "0644"
