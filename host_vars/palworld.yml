---
# Palworld dedicated server. Consumed by playbooks/steamcmd.yml.
# Valve's list has Palworld under Windows only — appid 2394010 has no Linux
# build, so it installs via SteamCMD's platform override and needs Proton/Wine
# to run. Installing it is all this playbook does.
steam_games:
  - palworld

steam_servers:
  palworld:
    start: ./PalServer.sh
    stop: stop
