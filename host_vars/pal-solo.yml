---
# pal-solo — Palworld dedicated server. Consumed by playbooks/steamcmd.yml.
# Valve's list has Palworld under Windows only, but 2394010 does ship a Linux
# depot — PalServer.sh below is it. Installs native, no Proton needed.
steam_games:
  - palworld

steam_servers:
  palworld:
    start: ./PalServer.sh
    # PalServer.sh is UE5 and reads nothing on stdin, so there's no console to
    # send 'stop' to — SIGINT is what gets it to save and exit cleanly.
    stop_signal: INT
