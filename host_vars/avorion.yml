---
# avorion — Avorion dedicated server. Consumed by playbooks/steamcmd.yml.
steam_games:
  - avorion

steam_servers:
  avorion:
    start: ./AvorionServer.sh
    # Avorion's console takes typed commands, "stop" saves and shuts down
    # cleanly — that's already the template default, listed here for clarity.
    stop: stop
