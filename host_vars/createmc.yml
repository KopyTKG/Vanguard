---
mc_eula: true # you accept https://aka.ms/MinecraftEULA
mc_java: temurin-21
mc_memory: 8G
mc_port: 25565
mc_motd: "Create+ survival"
mc_max_players: 4
mc_seed: 8675309 # only used when the world is first generated
mc_stop_cmd: "/stop"
# Mojang account names; resolved to UUIDs by the playbook. Placeholders — replace.
mc_whitelist: [Kopy_TKG]
mc_ops: [Kopy_TKG]
mc_properties:
  difficulty: hard
  view-distance: 12

mc_modpack:
  # Modrinth pack. Pinned: without `version` the newest *release* is used.
  source: modrinth
  pack: homestead
  version: "2.0" # Minecraft 1.20.1, Fabric (quoted so YAML keeps it a string)

# The pack marks athena as client-only, but chipped needs it on the server
# ("Mod 'Chipped' requires version 3.1.1 or later of athena, which is missing!").
mc_force_mods:
  - "athena-fabric-*.jar"

# Client-only mods shipped in the pack. A dedicated server can't load them
# ("Attempted to load class ... for invalid dist DEDICATED_SERVER"). Found by
# booting the pack's NeoForge server and removing whatever failed to load.
mc_remove_mods:
  - "statuseffectbars-*.jar"
