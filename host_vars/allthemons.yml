---
# allthemons — All the Mons (Cobblemon) modpack server. Consumed by
# playbooks/minecraft.yml. This is the worked example for the `minecraft`
# group: copy it for a new Minecraft client. Every option and its default is
# documented in group_vars/minecraft.yml.
#
# The server pack is ~1 GB: the install downloads it to /tmp and unpacks it, so
# the LXC needs a few GB free in /tmp and in ~minecraft.
mc_eula: true # you accept https://aka.ms/MinecraftEULA
mc_java: temurin-21
mc_memory: 8G
mc_port: 25565

mc_modpack:
  source: curseforge
  # CurseForge: the pack's "Server Files" zip, not the client modpack.
  url: https://mediafilez.forgecdn.net/files/8822/160/ServerFiles-1.3.0.zip
  version: "1.3.0" # label only; bump it (with a new url) to force a reinstall

  # Modrinth pack instead:
  #   source: modrinth
  #   pack: <slug>
  #   version: <optional>
