---
# Clients grouped by the app they run. All share host hosting.thekrew.app
# (set in group_vars/all.yml) and differ by SSH port.
#
# Baseline runs on every client; each group gets its own install playbook
# (playbooks/<group>.yml) and its own vars (group_vars/<group>.yml).

generic:
  hosts:
    esl: { ansible_port: 2225 }
    ts-server: { ansible_port: 2200 }
    grafana: { ansible_port: 2206 }
    proxy: { ansible_port: 2207 }
    jenkins: { ansible_port: 2208 }

# The hypervisor itself, not an LXC client: plain SSH on 22, and excluded from
# baseline/cleanup (playbooks/proxmox.yml covers it). Port is an assumption.
proxmox:
  hosts:
    pve: { ansible_port: 22 }

steamcmd:
  hosts:
    avorion: { ansible_port: 2209 } # steam_games slug: avorion (host_vars/avorion.yml)

foundryvtt:
  hosts:
    foundry: { ansible_port: 2210 } # host_vars/foundry.yml
    cybervtt: { ansible_port: 2211 } # host_vars/cybervtt.yml

minecraft:
  hosts:
    createmc: { ansible_port: 2204 } # host_vars/createmc.yml

web:
  hosts:
    #worldle-web: { ansible_port: 2203 }

csharp:
  hosts:
    #worldle-api: { ansible_port: 2202 }

postgress:
  hosts:
