---
# Catalog of every dedicated server SteamCMD can install, generated from the
# Valve wiki's Dedicated Servers List:
#   https://developer.valvesoftware.com/wiki/Dedicated_Servers_List
#
# Referenced by slug from `steam_games` (see host_vars/<client>.yml).
#   platform   which tables the wiki lists the server under. Informational
#              only — installs are always native, so a game with no Linux
#              depot fails loudly at download rather than quietly pulling
#              Windows binaries. The wiki is wrong often enough that guessing
#              from it is worse than the failure (see palworld).
#   anonymous  false means SteamCMD needs a real Steam account that owns the
#              game; playbooks/steamcmd.yml refuses to install those anonymously.
#   config     extra +app_set_config passed before app_update (GoldSrc mods).
#   force_platform  set to `windows` on an app that genuinely has no Linux
#              build and you intend to run under Proton/Wine. Off by default.
#
# Mare Nostrum is omitted: the wiki lists its AppID as "?".
# Anything else missing can be added per client via `steam_apps_extra`.
steam_apps:
  7-days-to-die: { appid: 294420, platform: any, anonymous: false }  # Game purchase required
  age-of-chivalry: { appid: 17515, platform: windows, anonymous: true }
